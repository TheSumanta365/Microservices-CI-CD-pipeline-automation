apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: 008971675777.dkr.ecr.us-east-1.amazonaws.com/my-flask-app-repo:v1  
        ports:
        - containerPort: 5000
